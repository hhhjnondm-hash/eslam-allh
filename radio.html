<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>راديو إسلامي - Radio Pro Max</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Radio Pro Max CSS -->
    <link rel="stylesheet" href="CSS/radio-pro-max.css">
</head>
<body>
    <!-- Background -->
    <div class="radio-background"></div>
    <div class="radio-particles" id="radio-particles"></div>

    <!-- Back Button -->
    <a href="index.html" class="back-btn" title="رجوع">
        <i class="fas fa-arrow-right"></i>
    </a>

    <!-- Main Container -->
    <div class="radio-main-container">
        <!-- Header -->
        <div class="radio-header">
            <h1 class="radio-title">راديو إسلامي</h1>
            <p class="radio-subtitle">استمع إلى تلاوات القرآن الكريم والأناشيد الإسلامية على مدار الساعة</p>
        </div>

        <!-- Radio Player Card -->
        <div class="radio-player-card">
            <!-- Station Selection -->
            <div class="station-section">
                <div class="station-header">
                    <i class="fas fa-broadcast-tower"></i>
                    <span>محطات الراديو</span>
                </div>
                <div class="station-grid" id="station-grid">
                    <!-- Stations will be loaded here -->
                </div>
            </div>

            <!-- Now Playing -->
            <div class="now-playing-section">
                <div class="now-playing-header">
                    <i class="fas fa-music"></i>
                    <span>يتم تشغيل الآن</span>
                </div>
                <div class="now-playing-content">
                    <!-- Station Avatar -->
                    <div class="station-avatar">
                        <img src="data/img/shaikh-Mahmoud-Khalil-Al-Hosary.webP" alt="المحطة" class="station-avatar-img" id="station-avatar" onerror="this.src='https://ui-avatars.com/api/?name=محمود+خليل+الحصري&background=random'">
                        <div class="station-avatar-name" id="station-name">محمود خليل الحصري</div>
                    </div>

                    <!-- Radio Controls -->
                    <div class="radio-controls">
                        <!-- Live Indicator -->
                        <div class="live-indicator">
                            <div class="live-dot"></div>
                            <span class="live-text">بث مباشر</span>
                        </div>

                        <!-- Control Buttons -->
                        <div class="control-buttons">
                            <button class="control-btn" id="prev-btn" title="المحطة السابقة">
                                <i class="fas fa-backward-step"></i>
                            </button>
                            <button class="control-btn play-btn" id="play-btn" title="تشغيل/إيقاف">
                                <i class="fas fa-play" id="play-icon"></i>
                            </button>
                            <button class="control-btn" id="next-btn" title="المحطة التالية">
                                <i class="fas fa-forward-step"></i>
                            </button>
                        </div>

                        <!-- Volume Control -->
                        <div class="volume-control">
                            <button class="volume-btn" id="volume-btn">
                                <i class="fas fa-volume-high" id="volume-icon"></i>
                            </button>
                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="1">
                        </div>
                    </div>
                </div>
                <div class="visualizer" id="visualizer"></div>
            </div>
        </div>
    </div>

    <audio id="radio-audio"></audio>

    <script src="JS/radio-pro-max.js"></script>
    
    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('radio-particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'radio-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }
        
        // Initialize
        createParticles();
    </script>
</body>
</html>
