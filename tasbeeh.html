<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المسبحة - رفيق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/simple-responsive.css">
    <link rel="stylesheet" href="CSS/ramadan.css">
    <link rel="stylesheet" href="CSS/dark-mode.css">
    <link rel="stylesheet" href="CSS/global-effects.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            color: white;
        }

        .tasbeeh-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Aurora Background */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .aurora-layer {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            opacity: 0.2;
            filter: blur(80px);
            animation: auroraMove 30s ease-in-out infinite;
        }

        .aurora-layer.layer-1 {
            background: linear-gradient(45deg, rgba(255, 215, 0, 0.2), rgba(255, 165, 0, 0.2), rgba(255, 99, 0, 0.2));
            animation-delay: 0s;
        }

        .aurora-layer.layer-2 {
            background: linear-gradient(135deg, rgba(255, 100, 0, 0.2), rgba(255, 215, 0, 0.2), rgba(255, 69, 0, 0.2));
            animation-delay: -10s;
        }

        .aurora-layer.layer-3 {
            background: linear-gradient(225deg, rgba(255, 140, 0, 0.2), rgba(255, 200, 0, 0.2), rgba(255, 50, 0, 0.2));
            animation-delay: -20s;
        }

        @keyframes auroraMove {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(10%, 10%) rotate(90deg);
            }
            50% {
                transform: translate(0, 20%) rotate(180deg);
            }
            75% {
                transform: translate(-10%, 10%) rotate(270deg);
            }
        }

        /* Main Content */
        .tasbeeh-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.5);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(15px);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 600;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .back-btn:hover {
            background: rgba(255, 215, 0, 0.3);
            border-color: #FFD700;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        /* Telegram Contact Button */
        .telegram-contact-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.9), rgba(0, 160, 220, 0.9));
            border: 2px solid rgba(0, 136, 204, 0.5);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(15px);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }

        .telegram-contact-btn:hover {
            background: linear-gradient(135deg, rgba(0, 160, 220, 0.95), rgba(34, 158, 217, 0.95));
            border-color: #0088cc;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.6);
        }

        .telegram-contact-btn svg {
            width: 20px;
            height: 20px;
        }

        .tasbeeh-title {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        @keyframes shimmer {
            to {
                background-position: 200% center;
            }
        }

        /* Bead Circle */
        .bead-circle {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto 40px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .bead-circle::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.6;
            }
        }

        .bead-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.5);
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .bead-counter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.8), rgba(255, 165, 0, 0.8));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 900;
            color: #1a1a2e;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .bead-counter:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 60px rgba(255, 215, 0, 1);
        }

        .bead-counter:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* Current Phrase */
        .current-phrase {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .phrase-translation {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }

        /* Phrase Buttons */
        .phrase-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .phrase-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-size: 16px;
        }

        .phrase-btn:hover,
        .phrase-btn.active {
            background: rgba(255, 215, 0, 0.3);
            border-color: #FFD700;
            transform: scale(1.05);
        }

        .phrase-btn.active {
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* Stats */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #FFD700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 4px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Reset Button */
        .reset-btn {
            background: linear-gradient(135deg, rgba(255, 100, 0, 0.8), rgba(255, 50, 0, 0.8));
            border: none;
            color: white;
            padding: 15px 40px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 100, 0, 0.5);
        }

        /* Particles */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            animation: particleFloat 10s linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .bead-circle {
                width: 280px;
                height: 280px;
            }

            .bead-counter {
                width: 100px;
                height: 100px;
                font-size: 28px;
            }

            .tasbeeh-title {
                font-size: 32px;
            }

            .current-phrase {
                font-size: 24px;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }

            .phrase-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Aurora Background -->
    <div class="aurora-bg">
        <div class="aurora-layer layer-1"></div>
        <div class="aurora-layer layer-2"></div>
        <div class="aurora-layer layer-3"></div>
    </div>

    <!-- Particles -->
    <div class="particles-container" id="particles"></div>

    <!-- Back Button -->
    <button onclick="goBack()" class="back-btn">
        <i class="fas fa-arrow-right"></i> العودة
    </button>

    <!-- Telegram Contact Button -->
    <a href="https://t.me/o_w_i" target="_blank" class="telegram-contact-btn">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM16.64 8.8C16.49 9.09 15.12 11.86 15.12 11.86C15.12 11.86 16.53 10.65 16.64 8.8ZM8.53 15.2L7.73 10.2C7.73 10.2 7.68 9.95 7.93 9.88C8.18 9.81 8.32 10.05 8.32 10.05L10.4 13.88L12.4 12.88L16.48 8.8C16.48 8.8 16.5 8.77 16.54 8.79C16.58 8.81 16.56 8.85 16.56 8.85L8.53 15.2Z" fill="white"/>
        </svg>
        تواصل
    </a>

    <!-- Main Content -->
    <div class="tasbeeh-container">
        <div class="tasbeeh-content">
            <h1 class="tasbeeh-title">المسبحة</h1>

            <!-- Current Phrase -->
            <div class="current-phrase" id="current-phrase">سبحان الله</div>
            <div class="phrase-translation" id="phrase-translation">Subhan Allah</div>

            <!-- Bead Circle -->
            <div class="bead-circle">
                <div class="bead-ring"></div>
                <div class="bead-counter" id="bead-counter">0</div>
            </div>

            <!-- Progress -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
                <div class="progress-text">
                    <span id="progress-current">0</span>
                    <span>/</span>
                    <span id="progress-target">33</span>
                </div>
            </div>

            <!-- Phrase Buttons -->
            <div class="phrase-buttons">
                <button class="phrase-btn active" data-phrase="سبحان الله" data-translation="Subhan Allah">سبحان الله</button>
                <button class="phrase-btn" data-phrase="الحمد لله" data-translation="Alhamdulillah">الحمد لله</button>
                <button class="phrase-btn" data-phrase="الله أكبر" data-translation="Allahu Akbar">الله أكبر</button>
                <button class="phrase-btn" data-phrase="لا إله إلا الله" data-translation="La ilaha illa Allah">لا إله إلا الله</button>
                <button class="phrase-btn" data-phrase="استغفر الله" data-translation="Astaghfirullah">استغفر الله</button>
            </div>

            <!-- Stats -->
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-value" id="today-count">0</div>
                    <div class="stat-label">اليوم</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="week-count">0</div>
                    <div class="stat-label">الأسبوع</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="total-count">0</div>
                    <div class="stat-label">الإجمالي</div>
                </div>
            </div>

            <!-- Reset Button -->
            <button class="reset-btn" id="reset-btn">
                <i class="fas fa-redo"></i> إعادة العداد
            </button>
        </div>
    </div>

    <script>
        // Back button function
        function goBack() {
            if (document.referrer && document.referrer !== window.location.href) {
                window.history.back();
            } else {
                window.location.href = 'profile.html';
            }
        }

        // Particle System
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }

        // Tasbeeh Logic
        let count = 0;
        let target = 33;
        let currentPhrase = 'سبحان الله';
        let todayCount = parseInt(localStorage.getItem('tasbeeh-today') || 0);
        let weekCount = parseInt(localStorage.getItem('tasbeeh-week') || 0);
        let totalCount = parseInt(localStorage.getItem('tasbeeh-total') || 0);

        const beadCounter = document.getElementById('bead-counter');
        const progressFill = document.getElementById('progress-fill');
        const progressCurrent = document.getElementById('progress-current');
        const progressTarget = document.getElementById('progress-target');
        const currentPhraseEl = document.getElementById('current-phrase');
        const phraseTranslationEl = document.getElementById('phrase-translation');
        const todayCountEl = document.getElementById('today-count');
        const weekCountEl = document.getElementById('week-count');
        const totalCountEl = document.getElementById('total-count');
        const resetBtn = document.getElementById('reset-btn');
        const phraseBtns = document.querySelectorAll('.phrase-btn');

        // Initialize
        beadCounter.textContent = count;
        todayCountEl.textContent = todayCount;
        weekCountEl.textContent = weekCount;
        totalCountEl.textContent = totalCount;
        progressTarget.textContent = target;

        // Update progress
        function updateProgress() {
            const percentage = (count / target) * 100;
            progressFill.style.width = percentage + '%';
            progressCurrent.textContent = count;
        }

        // Bead click
        beadCounter.addEventListener('click', () => {
            count++;
            beadCounter.textContent = count;
            
            // Add animation
            beadCounter.style.transform = 'translate(-50%, -50%) scale(0.9)';
            setTimeout(() => {
                beadCounter.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 100);
            
            // Update stats
            todayCount++;
            weekCount++;
            totalCount++;
            
            localStorage.setItem('tasbeeh-today', todayCount);
            localStorage.setItem('tasbeeh-week', weekCount);
            localStorage.setItem('tasbeeh-total', totalCount);
            
            todayCountEl.textContent = todayCount;
            weekCountEl.textContent = weekCount;
            totalCountEl.textContent = totalCount;
            
            updateProgress();
            
            // Check if target reached
            if (count >= target) {
                count = 0;
                beadCounter.textContent = count;
                updateProgress();
            }
        });

        // Phrase selection
        phraseBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                phraseBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentPhrase = btn.dataset.phrase;
                currentPhraseEl.textContent = currentPhrase;
                phraseTranslationEl.textContent = btn.dataset.translation;
                
                // Reset count when changing phrase
                count = 0;
                beadCounter.textContent = count;
                updateProgress();
            });
        });

        // Reset
        resetBtn.addEventListener('click', () => {
            count = 0;
            beadCounter.textContent = count;
            updateProgress();
        });

        // Initialize particles
        createParticles();
        updateProgress();
    </script>
</body>
</html>
