<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>المسبحة - رفيق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tasbeeh Pro Max Reimagined CSS -->
    <link rel="stylesheet" href="CSS/tasbeeh-pro-reimagined.css">
    <link rel="stylesheet" href="CSS/luxury-dark-mode.css" />
    <link rel="stylesheet" href="CSS/dark-mode-toggle.css" />
</head>
<body>
    <!-- Fluid Background -->
    <div class="fluid-background">
        <div class="fluid-shape fluid-shape-1"></div>
        <div class="fluid-shape fluid-shape-2"></div>
        <div class="fluid-shape fluid-shape-3"></div>
    </div>

    <!-- Noise Overlay -->
    <div class="noise-overlay"></div>

    <!-- Back Button -->
    <a href="profile.html" class="back-btn" title="رجوع">
        <i class="fas fa-arrow-right"></i>
    </a>

    <!-- Tasbeeh Wrapper -->
    <div class="tasbeeh-wrapper">
        <!-- Hero Section -->
        <div class="hero-section">
            <h1 class="hero-title">المسبحة</h1>
            <p class="hero-subtitle">ذِكْرُوا اللَّهَ ذِكْرًا كَثِيرًا</p>
        </div>

        <!-- 3D Bead Container -->
        <div class="magnetic-container">
            <button class="power-bead-btn" id="power-bead-btn">
                <div class="pulse-ring"></div>
                <div class="wave"></div>
                <div class="inner-glow"></div>
                <div class="press-layer"></div>
                <div class="counter" id="counter-display">0</div>
                <div class="counter-text">اضغط للذكر</div>
            </button>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <!-- Phrase Selector -->
            <div class="phrase-selector">
                <button class="phrase-pill active" data-phrase="سبحان الله">سبحان الله</button>
                <button class="phrase-pill" data-phrase="الحمد لله">الحمد لله</button>
                <button class="phrase-pill" data-phrase="الله أكبر">الله أكبر</button>
                <button class="phrase-pill" data-phrase="لا إله إلا الله">لا إله إلا الله</button>
                <button class="phrase-pill" data-phrase="استغفر الله">استغفر الله</button>
            </div>

            <!-- Progress Ring -->
            <div class="progress-ring-container">
                <div class="progress-ring">
                    <svg class="progress-ring-svg" viewBox="0 0 200 200">
                        <defs>
                            <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#ffd700" />
                                <stop offset="50%" style="stop-color:#ff8c00" />
                                <stop offset="100%" style="stop-color:#ff6347" />
                            </linearGradient>
                        </defs>
                        <circle class="progress-ring-bg" cx="100" cy="100" r="90"></circle>
                        <circle class="progress-ring-fill" id="progress-ring-fill" cx="100" cy="100" r="90" 
                                stroke-dasharray="565.48" stroke-dashoffset="565.48"></circle>
                    </svg>
                    <div class="progress-center">
                        <div class="progress-number" id="progress-number">0</div>
                        <div class="progress-label">من 33</div>
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="today-count">0</div>
                    <div class="stat-label">اليوم</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="week-count">0</div>
                    <div class="stat-label">الأسبوع</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="total-count">0</div>
                    <div class="stat-label">الإجمالي</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="action-btn" id="reset-btn">
                    <i class="fas fa-redo"></i>
                    إعادة العداد
                </button>
                <button class="action-btn danger" id="reset-all-btn">
                    <i class="fas fa-trash-alt"></i>
                    إعادة الكل
                </button>
            </div>
        </div>
    </div>

    <script>
        // Tasbeeh Logic
        let count = 0;
        let target = 33;
        let currentPhrase = 'سبحان الله';
        let todayCount = parseInt(localStorage.getItem('tasbeeh-today') || 0);
        let weekCount = parseInt(localStorage.getItem('tasbeeh-week') || 0);
        let totalCount = parseInt(localStorage.getItem('tasbeeh-total') || 0);

        const powerBeadBtn = document.getElementById('power-bead-btn');
        const counterDisplay = document.getElementById('counter-display');
        const progressRingFill = document.getElementById('progress-ring-fill');
        const progressNumber = document.getElementById('progress-number');
        const todayCountEl = document.getElementById('today-count');
        const weekCountEl = document.getElementById('week-count');
        const totalCountEl = document.getElementById('total-count');
        const resetBtn = document.getElementById('reset-btn');
        const resetAllBtn = document.getElementById('reset-all-btn');
        const phrasePills = document.querySelectorAll('.phrase-pill');

        // Initialize
        counterDisplay.textContent = count;
        todayCountEl.textContent = todayCount;
        weekCountEl.textContent = weekCount;
        totalCountEl.textContent = totalCount;

        // Progress ring calculation
        const circumference = 2 * Math.PI * 90; // 2πr where r=90

        function updateProgress() {
            const percentage = count / target;
            const offset = circumference - (percentage * circumference);
            progressRingFill.style.strokeDashoffset = offset;
            progressNumber.textContent = count;
        }

        // Haptic feedback
        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        // Create ripple effect
        function createRipple(event) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            
            const rect = powerBeadBtn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = event.clientX - rect.left - size / 2 + 'px';
            ripple.style.top = event.clientY - rect.top - size / 2 + 'px';
            
            powerBeadBtn.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 800);
        }

        // Create sparkle particles
        function createSparkles(x, y) {
            for (let i = 0; i < 12; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                const angle = (Math.random() * 360) * (Math.PI / 180);
                const distance = 50 + Math.random() * 100;
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                
                sparkle.style.setProperty('--tx', tx);
                sparkle.style.setProperty('--ty', ty);
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                
                powerBeadBtn.appendChild(sparkle);
                
                setTimeout(() => sparkle.remove(), 1000);
            }
        }

        // Bead click
        powerBeadBtn.addEventListener('click', (e) => {
            count++;
            counterDisplay.textContent = count;
            
            // Trigger haptic
            triggerHaptic();
            
            // Create ripple
            createRipple(e);
            
            // Create sparkles
            const rect = powerBeadBtn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            createSparkles(centerX, centerY);
            
            // Update stats
            todayCount++;
            weekCount++;
            totalCount++;
            
            localStorage.setItem('tasbeeh-today', todayCount);
            localStorage.setItem('tasbeeh-week', weekCount);
            localStorage.setItem('tasbeeh-total', totalCount);
            
            todayCountEl.textContent = todayCount;
            weekCountEl.textContent = weekCount;
            totalCountEl.textContent = totalCount;
            
            updateProgress();
            
            // Check if target reached
            if (count >= target) {
                count = 0;
                counterDisplay.textContent = count;
                updateProgress();
                
                // Celebration
                celebrateCompletion();
            }
        });

        // Celebration effect
        function celebrateCompletion() {
            const colors = ['#ffd700', '#ff8c00', '#ff6347', '#ffa500', '#ff1493'];
            
            for (let i = 0; i < 60; i++) {
                const particle = document.createElement('div');
                const size = Math.random() * 15 + 8;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const angle = (Math.random() * 360) * (Math.PI / 180);
                const distance = 250 + Math.random() * 250;
                const duration = 1200 + Math.random() * 600;
                
                particle.style.cssText = `
                    position: fixed;
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 1000;
                    left: 50%;
                    top: 50%;
                    transform: translate(-50%, -50%);
                    box-shadow: 0 0 30px ${color}, 0 0 60px ${color};
                `;
                
                document.body.appendChild(particle);
                
                const endX = Math.cos(angle) * distance;
                const endY = Math.sin(angle) * distance;
                
                particle.animate([
                    { 
                        transform: 'translate(-50%, -50%) scale(0) rotate(0deg)', 
                        opacity: 1 
                    },
                    { 
                        transform: `translate(calc(-50% + ${endX}px), calc(-50% + ${endY}px)) scale(1) rotate(720deg)`, 
                        opacity: 0 
                    }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.4, 0, 0.2, 1)'
                });
                
                setTimeout(() => particle.remove(), duration);
            }
            
            // Flash effect
            const flash = document.createElement('div');
            flash.style.cssText = `
                position: fixed;
                inset: 0;
                background: rgba(255, 215, 0, 0.3);
                pointer-events: none;
                z-index: 999;
                animation: flash-fade 0.5s ease-out forwards;
            `;
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 500);
        }

        // Add flash animation
        const flashStyle = document.createElement('style');
        flashStyle.textContent = `
            @keyframes flash-fade {
                from { opacity: 1; }
                to { opacity: 0; }
            }
        `;
        document.head.appendChild(flashStyle);

        // Phrase selection
        phrasePills.forEach(pill => {
            pill.addEventListener('click', () => {
                phrasePills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                
                currentPhrase = pill.dataset.phrase;
                
                // Reset count
                count = 0;
                counterDisplay.textContent = count;
                updateProgress();
            });
        });

        // Reset current counter
        resetBtn.addEventListener('click', () => {
            count = 0;
            counterDisplay.textContent = count;
            updateProgress();
        });

        // Reset all stats
        resetAllBtn.addEventListener('click', () => {
            if (confirm('هل أنت متأكد من إعادة جميع الإحصائيات؟')) {
                count = 0;
                todayCount = 0;
                weekCount = 0;
                totalCount = 0;
                
                localStorage.setItem('tasbeeh-today', 0);
                localStorage.setItem('tasbeeh-week', 0);
                localStorage.setItem('tasbeeh-total', 0);
                
                counterDisplay.textContent = count;
                todayCountEl.textContent = todayCount;
                weekCountEl.textContent = weekCount;
                totalCountEl.textContent = totalCount;
                updateProgress();
            }
        });

        // Initialize progress
        updateProgress();
    </script>
</body>
</html>
