<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>اقرأ - Reads Pro Max</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Reads Pro Max CSS -->
    <link rel="stylesheet" href="CSS/reads-pro-max.css">
</head>
<body>
    <!-- Background -->
    <div class="reads-background"></div>
    <div class="reads-particles" id="reads-particles"></div>

    <!-- Back Button -->
    <a href="index.html" class="back-btn" title="رجوع">
        <i class="fas fa-arrow-right"></i>
    </a>

    <!-- Main Container -->
    <div class="reads-main-container">
        <!-- Header -->
        <div class="reads-header">
            <h1 class="reads-title">اقرأ</h1>
            <p class="reads-subtitle">استمع وتلوا آيات القرآن الكريم مع المقرئين المشهورين</p>
        </div>

        <!-- Reads Grid -->
        <div class="reads-grid">
            <!-- Quraa Container -->
            <div class="quraa-container">
                <div class="quraa-header">
                    <i class="fas fa-users"></i>
                    <span>القراء</span>
                </div>
                <div class="quraa-list" id="quraa-list">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p class="loading-text">جاري تحميل القراء...</p>
                    </div>
                </div>
            </div>

            <!-- Soura Container -->
            <div class="soura-container">
                <div class="soura-header">
                    <i class="fas fa-book-quran"></i>
                    <span>السور</span>
                </div>
                <div class="soura-list" id="soura-list">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p class="loading-text">جاري تحميل السور...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ayah Content -->
        <div class="ayah-content-container">
            <div class="ayah-header">
                <i class="fas fa-book-open"></i>
                <span>آيات السورة</span>
            </div>
            
            <!-- Surah Info -->
            <div class="surah-info">
                <h2 class="surah-title" id="surah-title">سورة الفاتحة</h2>
                <p class="surah-subtitle" id="surah-subtitle">7 آيات</p>
            </div>
            
            <!-- Audio Source Toggle -->
            <div class="audio-source-toggle">
                <span class="audio-source-label">مصدر الصوت:</span>
                <div class="audio-source-options">
                    <button class="audio-source-btn active" data-source="api" id="api-source-btn">
                        <i class="fas fa-cloud"></i>
                        <span>API (متزامن)</span>
                    </button>
                    <button class="audio-source-btn" data-source="reciter" id="reciter-source-btn">
                        <i class="fas fa-user"></i>
                        <span>اضغط هنا اذا اردت تشغيل القاري المختار</span>
                    </button>
                </div>
            </div>
            
            <!-- Ayahs List -->
            <div class="ayahs-list" id="ayahs-list">
                <!-- Ayahs will be rendered here -->
            </div>
            
            <!-- Current Ayah Info -->
            <div class="current-ayah-info" id="current-ayah-info" style="display: flex;">
                <span class="ayah-indicator">آية</span>
                <span class="ayah-number-display" id="current-ayah-number">1 / 7</span>
            </div>
        </div>

        <!-- Audio Player -->
        <div class="audio-player-container">
            <div class="player-content">
                <!-- Player Avatar -->
                <div class="player-avatar">
                    <img src="data/img/shaikh-Mishari-Al-afasi.webP" alt="القارئ" class="player-avatar-img" id="player-avatar" onerror="this.src='https://ui-avatars.com/api/?name=مشاري+العفاسي&background=random'">
                    <div class="player-avatar-name" id="player-name">مشاري العفاسي</div>
                </div>

                <!-- Player Controls -->
                <div class="player-controls">
                    <!-- Progress Bar -->
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <div class="time-display">
                            <span id="current-time">00:00</span>
                            <span id="total-time">00:00</span>
                        </div>
                    </div>

                    <!-- Control Buttons -->
                    <div class="control-buttons">
                        <button class="control-btn" id="repeat-btn" title="تكرار">
                            <i class="fas fa-repeat"></i>
                        </button>
                        <button class="control-btn" id="prev-btn" title="السورة السابقة">
                            <i class="fas fa-backward-step"></i>
                        </button>
                        <button class="control-btn play-btn" id="play-btn" title="تشغيل/إيقاف">
                            <i class="fas fa-play" id="play-icon"></i>
                        </button>
                        <button class="control-btn" id="next-btn" title="السورة التالية">
                            <i class="fas fa-forward-step"></i>
                        </button>
                        <button class="control-btn" id="shuffle-btn" title="عشوائي">
                            <i class="fas fa-shuffle"></i>
                        </button>
                    </div>

                    <!-- Volume Control -->
                    <div class="volume-control">
                        <button class="volume-btn" id="volume-btn">
                            <i class="fas fa-volume-high" id="volume-icon"></i>
                        </button>
                        <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
            </div>
            <audio id="audio-element"></audio>
        </div>
    </div>

    <script src="JS/reads-pro-max.js"></script>
    
    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('reads-particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'reads-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }
        
        // Initialize
        createParticles();
    </script>
</body>
</html>
